# auth-service/src/main/resources/application.yml

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:h2:mem:authdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update

  h2:
    console:
      enabled: true

server:
  port: 8083

jwt:
  secret: "LxTwm+2Qe10qtr4zHNVwQ4mTFbqoBIehqTtaOVzLwcBFTSmLR+VogL+dhj2cRGDapKG3kWhiE9SU7f1SgbrNFw=="
  expiration: 3600000
  refresh-expiration: 86400000

logging:
  level:
    root: INFO
    com.prueba.graftsql: DEBUG

  file:
    name: ../logs/auth-service/app.log

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info
  endpoint:
    prometheus:
      enabled: true
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: auth-service
