server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: solicitudes
          uri: ${SOLICITUD_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/solicitudes/**
          filters:
            - name: CircuitBreaker
              args:
                name: solicitudCircuitBreaker
                fallbackUri: forward:/fallback/solicitudes
            - name: Retry
              args:
                retries: 3
                methods: GET,POST
                backoff:
                  delay: 100
                  maxDelay: 1000
                  multiplier: 1.5
        - id: evaluaciones
          uri: ${EVALUACION_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/evaluaciones/**
          filters:
            - name: CircuitBreaker
              args:
                name: evaluacionCircuitBreaker
                fallbackUri: forward:/fallback/evaluaciones
            - name: Retry
              args:
                retries: 3
                methods: GET,POST
                backoff:
                  delay: 100
                  maxDelay: 1000
                  multiplier: 1.5
        - id: autenticacion
          uri: ${AUTH_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth
            - name: Retry
              args:
                retries: 2
                methods: GET,POST

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,circuitbreaker,circuitbreakers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    circuitbreaker:
      enabled: true

resilience4j:
  circuitbreaker:
    instances:
      solicitudCircuitBreaker:
        registerHealthIndicator: true
        ringBufferSizeInClosedState: 10
        ringBufferSizeInHalfOpenState: 5
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 1s
        recordExceptions:
          - java.net.ConnectException
          - java.io.IOException
      evaluacionCircuitBreaker:
        registerHealthIndicator: true
        ringBufferSizeInClosedState: 10
        ringBufferSizeInHalfOpenState: 5
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 1s
        recordExceptions:
          - java.net.ConnectException
          - java.io.IOException
      authCircuitBreaker:
        registerHealthIndicator: true
        ringBufferSizeInClosedState: 10
        ringBufferSizeInHalfOpenState: 5
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 1s
        recordExceptions:
          - java.net.ConnectException
          - java.io.IOException
  timelimiter:
    instances:
      solicitudCircuitBreaker:
        cancelledByTimeout: true
        timeoutDuration: 3s
      evaluacionCircuitBreaker:
        cancelledByTimeout: true
        timeoutDuration: 3s
      authCircuitBreaker:
        cancelledByTimeout: true
        timeoutDuration: 3s
